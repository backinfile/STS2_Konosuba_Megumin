<!doctype html><meta charset="utf-8"><title>Layer boundaries</title><style>body{margin:0;background:#777;display:flex;align-items:flex-start;font:14px sans-serif}svg{width:750px;min-width:750px;height:auto}aside{position:sticky;top:0;background:#eee;padding:20px;width:320px}label{display:block;margin:5px}textarea{width:100%;height:330px}button{padding:7px}svg polygon{display:none}</style><svg id="art" viewBox="0 0 1148 1371"><image href="source/clean-reference.png" width="1148" height="1371"/><polygon id="hand_r" points="272,833 319,829 347,842 367,839 394,914 368,920 336,930 295,934 278,916" fill="none" stroke="#ffffff" stroke-width="2"/><polygon id="staff" points="28,166 119,167 149,300 183,295 205,357 254,409 278,463 282,534 271,559 241,605 275,724 397,1144 474,1308 477,1348 397,1363 375,1348 384,1247 350,1165 315,1060 275,933 261,850 230,735 195,665 147,621 122,594 121,551 109,513 119,472 143,437 133,426 109,452 87,421 27,279" fill="none" stroke="#00ff99" stroke-width="2"/><polygon id="head" points="0,0 1148,0 1148,631 814,632 785,675 758,798 722,805 710,746 704,706 697,647 677,656 649,663 613,664 577,657 558,643 545,664 561,712 558,765 554,808 522,787 500,729 488,699 474,685 439,651 0,645" fill="none" stroke="#c800ff" stroke-width="2"/><polygon id="hand_l" points="737,973 786,958 805,975 822,1020 813,1069 784,1079 751,1063 735,1025" fill="none" stroke="#ffff00" stroke-width="2"/><polygon id="arm_r" points="552,754 558,777 545,811 517,852 478,886 435,917 400,941 379,925 362,861 360,837 410,823 463,809 497,784 524,765" fill="none" stroke="#00ffff" stroke-width="2"/><polygon id="arm_l" points="696,741 724,779 746,813 771,870 804,952 790,973 746,984 734,947 720,901 700,858 687,820" fill="none" stroke="#ffaa00" stroke-width="2"/><polygon id="leg_r" points="514,1008 625,1007 608,1070 575,1163 563,1200 578,1255 585,1366 460,1366 453,1240 471,1176 503,1079" fill="none" stroke="#0077ff" stroke-width="2"/><polygon id="leg_l" points="621,1009 712,1003 699,1082 691,1189 718,1208 712,1261 762,1322 765,1359 613,1364 605,1264 608,1204 615,1106" fill="none" stroke="#ff0099" stroke-width="2"/><g id="dots"/></svg><aside><h2>Original source boundaries</h2><p id="coord">Click to record source coordinates.</p><label><input type="checkbox" data-name="hand_r">hand_r</label><label><input type="checkbox" data-name="staff">staff</label><label><input type="checkbox" data-name="head">head</label><label><input type="checkbox" data-name="hand_l">hand_l</label><label><input type="checkbox" data-name="arm_r">arm_r</label><label><input type="checkbox" data-name="arm_l">arm_l</label><label><input type="checkbox" data-name="leg_r">leg_r</label><label><input type="checkbox" data-name="leg_l">leg_l</label><button id="clear">Clear points</button><textarea id="points"></textarea></aside><script>const svg=document.querySelector('svg'),points=[];document.querySelectorAll('input').forEach(i=>i.onchange=()=>document.getElementById(i.dataset.name).style.display=i.checked?'block':'none');svg.onpointermove=e=>{const r=svg.getBoundingClientRect();document.getElementById('coord').textContent=Math.round((e.clientX-r.left)*1148/r.width)+', '+Math.round((e.clientY-r.top)*1371/r.height)};svg.onclick=e=>{const r=svg.getBoundingClientRect(),x=Math.round((e.clientX-r.left)*1148/r.width),y=Math.round((e.clientY-r.top)*1371/r.height);points.push([x,y]);document.getElementById('points').value=JSON.stringify(points);document.getElementById('dots').innerHTML=points.map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="cyan"/>`).join('')};document.getElementById('clear').onclick=()=>{points.length=0;document.getElementById('points').value='';document.getElementById('dots').innerHTML=''}</script>
